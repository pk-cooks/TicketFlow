spring.application.name=ticketflow-backend

# Local secrets live in the gitignored .env / .env.local at the repository root
# (see .env.example). Paths are relative to this module when running `mvnw spring-boot:run`.
spring.config.import=optional:file:../../.env[.properties],optional:file:../../.env.local[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway; Hibernate only validates the mapping.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
